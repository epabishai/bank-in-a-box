name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build multi-architecture image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=${{ runner.temp }}/release-image.tar,oci-artifact=false
          sbom: true
          provenance: true
      - name: Prepare images for scanning
        run: |
          for arch in amd64 arm64; do
            skopeo --override-os linux --override-arch "$arch" copy \
              "oci-archive:$RUNNER_TEMP/release-image.tar" \
              "docker-archive:$RUNNER_TEMP/$arch.tar"
            skopeo inspect --config "docker-archive:$RUNNER_TEMP/$arch.tar" \
              | jq -e --arg arch "$arch" '.os == "linux" and .architecture == $arch'
          done
      - name: Scan amd64 image for critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/amd64.tar
          format: table
          exit-code: '1'
          severity: CRITICAL
      - name: Scan arm64 image for critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/arm64.tar
          format: table
          exit-code: '1'
          severity: CRITICAL
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish scanned image
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          skopeo copy --all --preserve-digests \
            "oci-archive:$RUNNER_TEMP/release-image.tar" \
            "docker://$IMAGE_NAME:$GITHUB_REF_NAME"
      - name: Attest image provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Generate image SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.image.outputs.name }}:${{ github.ref_name }}
          output-file: image.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME" image.spdx.json
